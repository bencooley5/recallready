name: Refresh public recall snapshot

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest==8.3.5
      - name: Refresh and validate staged snapshot
        env:
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
        run: python -m scripts.refresh_data --output-dir data
      - run: pytest -q
      - run: python -m scripts.smoke_test
      - name: Commit public snapshot only
        run: |
          git add data/recalls.parquet data/snapshot_metadata.json data/validation_report.json
          if git diff --cached --quiet; then exit 0; fi
          source_date=$(python -c "import json; print(json.load(open('data/snapshot_metadata.json')).get('source_last_updated') or 'unknown')")
          git config user.name 'recallready-bot'
          git config user.email 'recallready-bot@users.noreply.github.com'
          git commit -m "data: refresh openFDA snapshot ${source_date}"
          git push
